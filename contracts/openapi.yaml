  /v1/trips/{trip}/sharing:
    put:
      operationId: setTripSharing
      summary: Explicitly enable or disable own live sharing
      security:
      - DevelopmentBearer: []
      parameters:
      - &id004
        in: path
        name: trip
        required: true
        schema:
          type: string
          format: uuid
      description: Idempotent. Enabling requires an active trip; disabling is also accepted on a terminal trip.
        Share-off removes ephemeral coordinates and invalidates existing subscriptions/queued positions. This does
        not start phone GPS collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
