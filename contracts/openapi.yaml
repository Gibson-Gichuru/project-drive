openapi: 3.1.0
info:
  title: Project Drive API
  version: 0.6.0
  description: Phase 0 private developer API. Trip identities are signed offline, expire within 15 minutes and are
    enabled only in explicit local/test environments. Trip endpoints return 401 when auth is disabled (including
    homelab). Navigation remains the private M1 spike. M3 streams require active membership and explicit sharing.
    Live positions are ephemeral and single-instance.
servers:
- url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: readiness
      summary: Database-aware readiness
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
  /v1/navigation/route:
    post:
      operationId: navigationRoute
      summary: Calculate a driving route in the self-hosted regional graph
      description: Private M1 spike only; origin/destination are processed without persistence or request-body logging.
        Maximum request body is 4096 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - origin
              - destination
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinate'
                destination:
                  $ref: '#/components/schemas/Coordinate'
      responses:
        '200':
          description: Route geometry and instructions, with distances in meters and times in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationRoute'
        '400':
          description: Invalid
          missing: null
          unknown or oversized request fields: null
        '422':
          description: No drivable route in the regional graph
        '503':
          description: Navigation is not configured or upstream service is unavailable
  /maps/tiles/{z}/{x}/{y}:
    get:
      operationId: vectorTile
      summary: Regional OpenMapTiles vector tile
      parameters:
      - in: path
        name: z
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 14
      - in: path
        name: x
        required: true
        schema:
          type: integer
          minimum: 0
      - in: path
        name: y
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Vector tile with source attribution requirements
        '204':
          description: Empty tile
        '400':
          description: Tile coordinate is outside the zoom grid
        '404':
          description: No tile or map stack is not configured
        '503':
          description: Tile service is unavailable
  /v1/trips:
    post:
      operationId: createTrip
      summary: Create a private planned trip
      security:
      - DevelopmentBearer: []
      description: 'Responses use Cache-Control: no-store. Maximum JSON body is 4096 bytes. Non-members receive
        404; mutations derive identity from the bearer. Lifecycle retries to the current target state are safe.
        Terminal trips retain member read access but cannot start, invite or join.'
      parameters:
      - &id003
        name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
        description: Client-generated UUID, reused on network retry. For trip creation, a changed name or endpoint returns 409.
          For invites, duplicate keys return 409 invite_already_created; secrets cannot be recovered. Revoke the
          returned invite ID and use a new key if the secret was lost.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid request or invalid/expired/revoked/exhausted invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid/expired identity or development auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Active member lacks owner permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip/invite not found or caller is not an active member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid transition, owner cannot leave, capacity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database timeout or unavailable; retry with same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                origin:
                  $ref: '#/components/schemas/Coordinate'
                destination:
                  $ref: '#/components/schemas/Coordinate'
              dependentRequired:
                origin: [destination]
                destination: [origin]
              description: Android requires both endpoints. Legacy M2 requests may omit both; either endpoint alone is invalid.
