openapi: 3.1.0
info:
  title: Project Drive API
  version: 0.1.0
  description: Phase 0 API contract. Authentication and trip endpoints arrive in M2.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: readiness
      summary: Database-aware readiness
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { const: ok }
    Ready:
      type: object
      required: [status]
      properties:
        status: { const: ready }
    NotReady:
      type: object
      required: [status]
      properties:
        status: { const: not_ready }
