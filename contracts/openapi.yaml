        '401':
          description: Missing/invalid/expired identity or development auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Active member lacks owner permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip/invite not found or caller is not an active member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid transition, owner cannot leave, capacity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database timeout or unavailable; retry with same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
