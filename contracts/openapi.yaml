components:
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          const: ok
    Ready:
      type: object
      required:
      - status
      properties:
        status:
          const: ready
    NotReady:
      type: object
      required:
      - status
      properties:
        status:
          const: not_ready
    Coordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    NavigationRoute:
      type: object
      required:
      - geometry
      - distance_m
      - duration_s
      - maneuvers
      properties:
        geometry:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Coordinate'
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        maneuvers:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - instruction
            - start_index
            - end_index
            - distance_m
            - duration_s
            properties:
              instruction:
                type: string
              start_index:
                type: integer
                minimum: 0
              end_index:
                type: integer
                minimum: 0
              distance_m:
                type: number
                minimum: 0
              duration_s:
                type: number
                minimum: 0
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        invite_id:
          type: string
          format: uuid
          description: Only on invite_already_created, for owner recovery by revocation.
    Trip:
      type: object
      required:
      - id
      - owner_id
      - name
      - status
      - created_at
      - started_at
      - ended_at
      properties:
        id: *id001
        owner_id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum:
          - planned
          - active
          - completed
          - cancelled
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
    Member:
      type: object
      required:
      - user_id
      - display_name
      - role
      - sharing_enabled
      - joined_at
      properties:
        user_id: *id001
        display_name:
          type: string
        role:
          type: string
          enum:
          - owner
          - member
        sharing_enabled:
          type: boolean
          description: Always false until explicit sharing support in M3.
        joined_at:
          type: string
          format: date-time
    Members:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
    Invite:
      type: object
      required:
      - id
      - token
      - expires_at
      - max_uses
      properties:
        id: *id001
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 256-bit secret returned once. Only its SHA-256 hash is stored.
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
          minimum: 1
          maximum: 100
    Left:
      type: object
      required:
      - status
      properties:
        status:
          const: left
    Revoked:
      type: object
      required:
      - status
      properties:
        status:
          const: revoked
  securitySchemes:
    DevelopmentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA only; project-drive-local issuer, project-drive-api audience, UUID subject, name, iat and
        exp. Offline local/test issuer only.
