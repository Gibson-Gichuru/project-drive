  /v1/trips/{trip}/stream:
    get:
      operationId: tripStream
      summary: Authenticated WebSocket for active sharing members
      description: 'Authorization: Bearer header required; URL query credentials/parameters rejected. Same-origin
        browser handshakes only; native clients may omit Origin. Optional project-drive.v1 subprotocol. After upgrade
        follow contracts/websocket/events.json and docs/milestones/M3.md. Client text messages are at most 4096
        bytes by default; configure a 64 KiB client read limit for bounded snapshots. Protocol-level handshake failures
        may use the WebSocket library plain HTTP error response.'
      security:
      - DevelopmentBearer: []
      parameters:
      - *id004
      responses:
        '101':
          description: WebSocket upgrade; first event is a freshly authorized trip.snapshot
        '400':
          description: Invalid UUID/body/query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired bearer; authentication disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Owner permission or explicit sharing required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Non-member, removed member or resource absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trip not active, invalid transition or owner removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Live connection, per-user or trip capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authorization store unavailable; live data fails closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/trips/{trip}/telemetry:
    post:
      operationId: uploadDerivedTelemetry
      summary: Upload explicitly selected derived estimates
      security:
      - DevelopmentBearer: []
      parameters:
      - name: trip
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Active membership and verified identity required; no-store. No raw coordinates or sensor
        samples accepted. Upload only for active/completed trips, within 24 hours of recording end; maximum
        recording duration four hours, 100 ordered candidate events, 64 KiB request and 20 recordings per
        user/trip. recording_id is the idempotency key: identical retry is accepted, changed payload or
        identity/trip returns 409. Only the authenticated user can read their own summaries, even if another
        member owns the trip. Server records/events expire together after seven days. Estimates are client-derived
        and uncalibrated. Duration must agree with timestamps within five seconds; coverage cannot exceed
        duration; distance is bounded by 100 m/s times covered time; event counts must match included plus
        dropped details. Query parameters are forbidden.'
      responses:
        '202':
          description: Accepted or identical retry
        '400':
          description: Invalid bounded estimate batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/expired identity or auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not an active member or missing trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state, duplicate conflict or retention capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; retry same recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
  /v1/trips/{trip}/summary:
    get:
      operationId: getPersonalTripSummaries
      summary: Read only your own trip telemetry summaries
      security:
      - DevelopmentBearer: []
      parameters:
      - name: trip
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Active membership and verified identity required; no-store. No raw coordinates or sensor
        samples accepted. Upload only for active/completed trips, within 24 hours of recording end; maximum
        recording duration four hours, 100 ordered candidate events, 64 KiB request and 20 recordings per
        user/trip. recording_id is the idempotency key: identical retry is accepted, changed payload or
        identity/trip returns 409. Only the authenticated user can read their own summaries, even if another
        member owns the trip. Server records/events expire together after seven days. Estimates are client-derived
        and uncalibrated. Duration must agree with timestamps within five seconds; coverage cannot exceed
        duration; distance is bounded by 100 m/s times covered time; event counts must match included plus
        dropped details. Query parameters are forbidden.'
      responses:
        '200':
          description: Your retained summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalTelemetrySummaries'
        '400':
          description: Invalid bounded estimate batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/expired identity or auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not an active member or missing trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state, duplicate conflict or retention capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; retry same recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    TelemetrySummary:
      type: object
      additionalProperties: false
      required:
      - started_at
      - ended_at
      - duration_s
      - covered_s
      - distance_m
      - mean_speed_mps
      - max_speed_mps
      - speed_samples
      - gps_samples
      - rejected_gps_samples
      - imu_samples
      - rotation_samples
      - acceleration_candidates
      - braking_candidates
      - lateral_candidates
      - dropped_events
      - mean_accuracy_meters
      - interrupted
      - source
      - orientation
      - calibration
      - confidence
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_s:
          type: number
          minimum: 0
          maximum: 14400
        covered_s:
          type: number
          minimum: 0
          maximum: 14400
        distance_m:
          type: number
          minimum: 0
          maximum: 1440000
        mean_speed_mps:
          type: number
          minimum: 0
          maximum: 100
        max_speed_mps:
          type: number
          minimum: 0
          maximum: 100
        speed_samples:
          type: integer
          minimum: 0
          maximum: 2000000
        gps_samples:
          type: integer
          minimum: 0
          maximum: 2000000
        rejected_gps_samples:
          type: integer
          minimum: 0
          maximum: 2000000
        imu_samples:
          type: integer
          minimum: 0
          maximum: 2000000
        rotation_samples:
          type: integer
          minimum: 0
          maximum: 2000000
        acceleration_candidates:
          type: integer
          minimum: 0
          maximum: 2000000
        braking_candidates:
          type: integer
          minimum: 0
          maximum: 2000000
        lateral_candidates:
          type: integer
          minimum: 0
          maximum: 2000000
        dropped_events:
          type: integer
          minimum: 0
          maximum: 2000000
        mean_accuracy_meters:
          type: number
          minimum: 0
          maximum: 50
        interrupted:
          type: boolean
        source:
          const: phone_gps_imu_v1
        orientation:
          enum:
          - available
          - unavailable
        calibration:
          const: uncalibrated
        confidence:
          type: number
          minimum: 0
          maximum: 0.6
    TelemetryEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - magnitude
      - confidence
      - source
      - accuracy_meters
      - elapsed_ms
      - occurred_at
      - orientation
      - calibration
      properties:
        type:
          enum:
          - acceleration_candidate
          - braking_candidate
          - lateral_candidate
        magnitude:
          type: number
          minimum: 0
          maximum: 30
        confidence:
          type: number
          minimum: 0
          maximum: 0.6
        source:
          const: gps_delta
        accuracy_meters:
          type: number
          exclusiveMinimum: 0
          maximum: 50
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 14400000
        occurred_at:
          type: string
          format: date-time
        orientation:
          enum:
          - available
          - unavailable
        calibration:
          const: uncalibrated
    TelemetryBatch:
      type: object
      additionalProperties: false
      required:
      - version
      - recording_id
      - summary
      - events
      properties:
        version:
          const: 1
        recording_id:
          type: string
          format: uuid
        summary:
          $ref: '#/components/schemas/TelemetrySummary'
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
    PersonalTelemetrySummaries:
      type: object
      required:
      - recordings
      - estimates
      properties:
        estimates:
          const: true
        recordings:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - recording_id
            - summary
            - expires_at
            properties:
              recording_id:
                type: string
                format: uuid
              summary:
                $ref: '#/components/schemas/TelemetrySummary'
              expires_at:
                type: string
                format: date-time
    Health:
      type: object
      required:
      - status
      properties:
        status:
          const: ok
    Ready:
      type: object
      required:
      - status
      properties:
        status:
          const: ready
    NotReady:
      type: object
      required:
      - status
      properties:
        status:
          const: not_ready
    Coordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    NavigationRoute:
      type: object
      required:
      - geometry
      - distance_m
      - duration_s
      - maneuvers
      properties:
        geometry:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Coordinate'
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        maneuvers:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - instruction
            - start_index
            - end_index
            - distance_m
            - duration_s
            properties:
              instruction:
                type: string
              start_index:
                type: integer
                minimum: 0
              end_index:
                type: integer
                minimum: 0
              distance_m:
                type: number
                minimum: 0
              duration_s:
                type: number
                minimum: 0
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        invite_id:
          type: string
          format: uuid
          description: Only on invite_already_created, for owner recovery by revocation.
    Trip:
      type: object
      required:
      - id
      - owner_id
      - name
      - status
      - created_at
      - started_at
      - ended_at
      properties:
        origin:
          oneOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
        destination:
          oneOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
        id: *id001
        owner_id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum:
          - planned
          - active
          - completed
          - cancelled
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
    Member:
      type: object
      required:
      - user_id
      - display_name
      - role
      - sharing_enabled
      - joined_at
      properties:
        user_id: *id001
        display_name:
          type: string
        role:
          type: string
          enum:
          - owner
          - member
        sharing_enabled:
          type: boolean
          description: Explicit trip-scoped opt-in; only active sharing members can stream.
        joined_at:
          type: string
          format: date-time
    Members:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
    Invite:
      type: object
      required:
      - id
      - token
      - expires_at
      - max_uses
      properties:
        id: *id001
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 256-bit secret returned once. Only its SHA-256 hash is stored.
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
          minimum: 1
          maximum: 100
    Left:
      type: object
      required:
      - status
      properties:
        status:
          const: left
    Revoked:
      type: object
      required:
      - status
      properties:
        status:
          const: revoked
    Sharing:
      type: object
      required:
      - sharing_enabled
      properties:
        sharing_enabled:
          type: boolean
    Removed:
      type: object
      required:
      - status
      properties:
        status:
          const: removed
  securitySchemes:
    DevelopmentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA only; project-drive-local issuer, project-drive-api audience, UUID subject, name, iat and
        exp. Offline local/test issuer only.
