  /v1/trips/{trip}/members/{member}:
    delete:
      operationId: removeTripMember
      summary: Owner removes a member from a planned or active trip
      description: Owner cannot remove self. Removal is idempotent and bans rejoining this trip in Phase 0, including
        with an older usable invite. Existing reads/streams are revoked and positions are removed. Ordinary leave
        allows rejoining with a usable invite, with sharing off.
      security:
      - DevelopmentBearer: []
      parameters:
      - *id004
      - in: path
        name: member
        required: true
        schema:
          type: string
          format: uuid
      responses:
