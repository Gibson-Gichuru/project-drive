apiVersion: v1
kind: Service
metadata:
  name: project-drive-db
  labels:
    app.kubernetes.io/name: project-drive-db
    app.kubernetes.io/part-of: project-drive
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: project-drive-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: project-drive-db
  labels:
    app.kubernetes.io/name: project-drive-db
    app.kubernetes.io/part-of: project-drive
spec:
  serviceName: project-drive-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-drive-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-drive-db
        app.kubernetes.io/part-of: project-drive
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgis
          image: postgis/postgis:17-3.5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
