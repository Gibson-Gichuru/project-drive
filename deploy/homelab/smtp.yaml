apiVersion: v1
kind: Service
metadata:
  name: project-drive-smtp
  labels:
    app.kubernetes.io/part-of: project-drive
spec:
  selector:
    app.kubernetes.io/name: project-drive-smtp
  ports:
  - name: smtp
    port: 587
    targetPort: smtp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-drive-smtp
  labels:
    app.kubernetes.io/part-of: project-drive
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: project-drive-smtp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-drive-smtp
        app.kubernetes.io/part-of: project-drive
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: signing-key
        image: boky/postfix:v5.2.1@sha256:0632783c64183446c4edeae9092a2e015fdc0c4e8a3976bdf8878a7fc2146361
        command:
        - sh
        - -ec
        - cp /signing/* /keys/; chmod 600 /keys/*
        volumeMounts:
        - name: signing-secret
          mountPath: /signing
          readOnly: true
        - name: signing
          mountPath: /keys
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: smtp
        image: boky/postfix:v5.2.1@sha256:0632783c64183446c4edeae9092a2e015fdc0c4e8a3976bdf8878a7fc2146361
        ports:
        - name: smtp
          containerPort: 587
        env:
        - name: ALLOWED_SENDER_DOMAINS
          value: outset-mail.ripples.boo
        - name: POSTFIX_myhostname
          value: outset-mail.ripples.boo
        - name: POSTFIX_mynetworks
          value: 127.0.0.0/8 10.42.0.0/16
        - name: POSTFIX_message_size_limit
          value: '131072'
        - name: POSTFIX_smtp_tls_security_level
          value: encrypt
        - name: POSTFIX_smtp_tls_loglevel
          value: '0'
        - name: POSTFIX_maximal_queue_lifetime
          value: 1h
        - name: POSTFIX_bounce_queue_lifetime
          value: 1h
        - name: POSTFIX_inet_protocols
          value: ipv4
        - name: ANONYMIZE_EMAILS
          value: paranoid
        - name: LOG_FORMAT
          value: json
        startupProbe:
          tcpSocket:
            port: smtp
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: smtp
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: smtp
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - NET_BIND_SERVICE
        volumeMounts:
        - name: queue
          mountPath: /var/spool/postfix
        - name: signing
          mountPath: /etc/opendkim/keys
      volumes:
      - name: queue
        persistentVolumeClaim:
          claimName: project-drive-mail-queue
      - name: signing
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: signing-secret
        secret:
          secretName: project-drive-mail-signing
          defaultMode: 384
