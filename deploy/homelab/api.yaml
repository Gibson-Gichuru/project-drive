apiVersion: v1
kind: Service
metadata:
  name: project-drive-api
  labels:
    app.kubernetes.io/name: project-drive-api
    app.kubernetes.io/part-of: project-drive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-drive-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-drive-api
  labels:
    app.kubernetes.io/name: project-drive-api
    app.kubernetes.io/part-of: project-drive
spec:
  replicas: 1
  # M3 live state is single-instance and deliberately ephemeral across releases.
  strategy:
    type: Recreate
    rollingUpdate: null
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: project-drive-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-drive-api
        app.kubernetes.io/part-of: project-drive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/gibson-gichuru/project-drive:bootstrap
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: DATABASE_URL
            - name: MIGRATIONS_DIR
              value: /app/migrations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/gibson-gichuru/project-drive:bootstrap
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: DATABASE_URL
            - name: API_ADDR
              value: :8080
            - name: APP_ENV
              value: homelab
            - name: MAP_TILE_URL
              value: http://project-drive-tiles:3000
            - name: NAVIGATION_URL
              value: http://project-drive-router:8002
            - name: PLACE_INDEX_PATH
              value: /map-data/kenya-places-v1.json
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: places
              mountPath: /map-data
              subPath: releases/kenya-search-90ce3f74
              readOnly: true
      volumes:
        - name: places
          persistentVolumeClaim:
            claimName: project-drive-map-data
