apiVersion: v1
kind: Service
metadata:
  name: project-drive-api
  labels:
    app.kubernetes.io/name: project-drive-api
    app.kubernetes.io/part-of: project-drive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-drive-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-drive-api
  labels:
    app.kubernetes.io/name: project-drive-api
    app.kubernetes.io/part-of: project-drive
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: project-drive-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-drive-api
        app.kubernetes.io/part-of: project-drive
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/gibson-gichuru/project-drive-api:bootstrap
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: DATABASE_URL
            - name: MIGRATIONS_DIR
              value: /app/migrations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/gibson-gichuru/project-drive-api:bootstrap
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-drive-db
                  key: DATABASE_URL
            - name: API_ADDR
              value: :8080
            - name: APP_ENV
              value: homelab
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
