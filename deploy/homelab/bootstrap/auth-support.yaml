# Operator-owned private Auth ingress policy. Reconciler RBAC is unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-drive-auth-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: project-drive-auth
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: project-drive-api
    ports:
    - protocol: TCP
      port: 9999
