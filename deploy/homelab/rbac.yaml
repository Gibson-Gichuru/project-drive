apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-drive-reconciler
  namespace: homelab-apps
  labels:
    app.kubernetes.io/part-of: project-drive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-drive-reconciler
  namespace: homelab-apps
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-drive-reconciler
  namespace: homelab-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-drive-reconciler
subjects:
  - kind: ServiceAccount
    name: project-drive-reconciler
    namespace: homelab-apps
