apiVersion: v1
kind: Service
metadata:
  name: project-drive-tiles
  labels: {app.kubernetes.io/part-of: project-drive}
spec:
  selector: {app.kubernetes.io/name: project-drive-tiles}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-drive-tiles
  labels: {app.kubernetes.io/part-of: project-drive}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: project-drive-tiles}
  template:
    metadata:
      labels: {app.kubernetes.io/name: project-drive-tiles, app.kubernetes.io/part-of: project-drive}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: martin
          image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
          args: ["--workers", "2", "--cache-size", "64", "--webui", "disable", "--font", "/data/NotoSans-Regular.ttf", "/data/kenya.mbtiles"]
          env: [{name: RUST_LOG, value: "off"}]
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: releases/kenya-20261113-6da91bb2/tiles
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: project-drive-map-data}
---
apiVersion: v1
kind: Service
metadata:
  name: project-drive-router
  labels: {app.kubernetes.io/part-of: project-drive}
spec:
  selector: {app.kubernetes.io/name: project-drive-router}
  ports: [{name: http, port: 8002, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-drive-router
  labels: {app.kubernetes.io/part-of: project-drive}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: project-drive-router}
  template:
    metadata:
      labels: {app.kubernetes.io/name: project-drive-router, app.kubernetes.io/part-of: project-drive}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valhalla
          image: ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956
          # Request logging is suppressed: upstream logs can contain route locations.
          command: ["/bin/sh", "-ec"]
          args: ["exec valhalla_service /custom_files/valhalla.json 2 >/dev/null 2>&1"]
          ports: [{name: http, containerPort: 8002}]
          startupProbe:
            httpGet: {path: /status, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /status, port: http}
          livenessProbe:
            httpGet: {path: /status, port: http}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 2, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /custom_files
              subPath: releases/kenya-20261113-6da91bb2/valhalla
              readOnly: true
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: project-drive-map-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
