# Overlay: docker compose -f infra/compose.yaml -f infra/maps.compose.yaml --env-file .env up -d --build
services:
  api:
    environment:
      MAP_TILE_URL: http://tiles:3000
      NAVIGATION_URL: http://router:8002
  tiles:
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    command: ["--workers", "2", "--cache-size", "64", "--font", "/data/NotoSans-Regular.ttf", "/data/kenya.mbtiles"]
    environment: {RUST_LOG: "off"}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ${MAP_DATA_DIR:?Set MAP_DATA_DIR to the built map-data directory}/tiles:/data:ro
    restart: unless-stopped
  router:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956
    entrypoint: ["/bin/sh", "-ec"]
    command: ["exec valhalla_service /custom_files/valhalla.json 2 >/dev/null 2>&1"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ${MAP_DATA_DIR:?Set MAP_DATA_DIR to the built map-data directory}/valhalla:/custom_files:ro
    restart: unless-stopped
