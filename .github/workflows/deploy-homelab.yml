name: Deploy to homelab

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: project-drive-homelab-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Set immutable image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ${{ steps.image.outputs.ref }}
      - name: Update GitOps release after successful CI
        run: |
          if git fetch origin refs/heads/homelab-deploy:refs/remotes/origin/homelab-deploy; then
            previous=$(git show origin/homelab-deploy:deploy/homelab/kustomization.yaml | sed -n 's/^    newTag: //p')
            if git cat-file -e "${previous}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$RELEASE_SHA" "$previous"; then
              echo 'A matching or newer tested source is already deployed.'
              exit 0
            fi
            git switch --force-create homelab-deploy origin/homelab-deploy
            git checkout "$RELEASE_SHA" -- deploy/homelab
          else
            git switch --create homelab-deploy "$RELEASE_SHA"
          fi
          sed -i -E "s/^    newTag: .*/    newTag: ${RELEASE_SHA}/" deploy/homelab/kustomization.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/homelab
          if ! git diff --cached --quiet; then
            git commit -m "deploy: promote tested source ${RELEASE_SHA}"
            git push --set-upstream origin homelab-deploy
          fi
