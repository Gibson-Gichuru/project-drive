name: Deploy to homelab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['services/api/**']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ${{ steps.image.outputs.ref }}
      - name: Update GitOps image reference
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if git fetch origin refs/heads/homelab-deploy:refs/remotes/origin/homelab-deploy; then
            git switch --force-create homelab-deploy origin/homelab-deploy
            git checkout "${GITHUB_SHA}" -- deploy/homelab
          else
            git switch --create homelab-deploy "${GITHUB_SHA}"
          fi
          sed -i -E "s/^    newTag: .*/    newTag: ${IMAGE_TAG}/" deploy/homelab/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/homelab/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "deploy: update API image to ${IMAGE_TAG}"
            git push --set-upstream origin homelab-deploy
          fi
